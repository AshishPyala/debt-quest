<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#080705"><link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Debt Quest">

<title>Debt Quest</title>
<style>
@font-face{font-family:'Bebas Neue';src:url(fonts/bebas.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Azeret Mono';font-weight:400;src:url(fonts/azeret-400.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Azeret Mono';font-weight:500;src:url(fonts/azeret-500.woff2) format('woff2');font-display:swap}
:root{--bg:#080705;--ink:#0e0c09;--gold:#d4b077;--gold2:#b8964e;--teal:#3fd6d0;--rust:#e0703a;--txt:#f2ede6;--mut:#8a8072;--card:rgba(14,12,9,.78)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Azeret Mono',ui-monospace,Menlo,monospace;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 15% 0%,rgba(184,86,30,.35),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(30,100,106,.45),transparent 55%),var(--bg)}
body::after{content:'';position:fixed;left:-50%;right:-50%;bottom:-10%;height:60vh;z-index:-1;pointer-events:none;
 background-image:linear-gradient(rgba(63,214,208,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(63,214,208,.35) 1px,transparent 1px);background-size:60px 60px;
 transform:perspective(320px) rotateX(62deg);transform-origin:bottom;mask-image:linear-gradient(transparent,#000 70%);-webkit-mask-image:linear-gradient(transparent,#000 70%);animation:grid 3s linear infinite}
@keyframes grid{to{background-position:0 60px,0 0}}
.wrap{max-width:900px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:46px;text-align:center;margin:10px 0 0;letter-spacing:.18em;color:var(--txt);text-shadow:0 0 6px var(--teal),0 0 22px rgba(63,214,208,.6)}
.brand{display:block;text-align:center;font-family:'Bebas Neue',sans-serif;letter-spacing:.45em;font-size:13px;color:var(--gold);text-shadow:0 0 8px rgba(212,176,119,.7)}
.sub{text-align:center;color:var(--mut);font-size:11px;letter-spacing:.08em;margin:6px 0 14px}
.card{background:var(--card);backdrop-filter:blur(6px);border:1px solid rgba(63,214,208,.55);border-radius:4px;padding:14px;margin:12px 0;box-shadow:0 0 12px rgba(63,214,208,.25),inset 0 0 18px rgba(63,214,208,.06);position:relative}
.card::before{content:'';position:absolute;top:-1px;left:14px;width:60px;height:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.card>b,.card b:first-child{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.2em;font-size:18px;color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.stat{text-align:center}.stat b{display:block;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:30px;letter-spacing:.06em;color:var(--teal)!important;text-shadow:0 0 10px rgba(63,214,208,.8)}.stat span{font-size:10px;letter-spacing:.2em;color:var(--mut)}
.bar{height:8px;background:rgba(255,255,255,.04);border-radius:0;overflow:visible;border:0;border-bottom:1px solid rgba(63,214,208,.25);position:relative}
.bar i{display:block;height:100%;background:var(--rust);box-shadow:0 0 6px var(--rust),0 0 18px var(--rust);transition:width .8s cubic-bezier(.2,.9,.2,1);position:relative}
.bar i::after{content:'';position:absolute;right:-2px;top:-3px;width:4px;height:14px;background:#fff;box-shadow:0 0 10px #fff,0 0 20px var(--rust)}
.bar.xp i{background:var(--teal);box-shadow:0 0 6px var(--teal),0 0 18px var(--teal)}.bar.cash i{background:var(--gold);box-shadow:0 0 6px var(--gold),0 0 18px var(--gold)}
.bosses{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.boss{position:relative;background:var(--card);border:1px solid rgba(224,112,58,.6);border-radius:4px;padding:12px;box-shadow:0 0 10px rgba(224,112,58,.25)}
.boss.dead{border-color:#333;box-shadow:none;opacity:.35}
.boss.target{border:2px solid #ff8a3d;box-shadow:0 0 22px rgba(255,138,61,.85),0 0 46px rgba(255,138,61,.35),inset 0 0 14px rgba(255,138,61,.18)}
.tgt{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:.16em;color:#0b0702;background:#ff8a3d;padding:1px 6px;border-radius:3px;box-shadow:0 0 8px #ff8a3d;margin-left:auto;margin-right:6px}
.boss h3{margin:0 0 4px;font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.12em;font-size:20px}
.boss .em{float:right;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.15em;padding:3px 7px;border:1px solid currentColor;color:var(--rust);text-shadow:0 0 6px currentColor}
.boss.target .em{color:#ff8a3d}.boss.dead .em{color:var(--mut)}
.meta{font-size:10px;color:var(--mut);margin-bottom:6px;letter-spacing:.04em}.hp{font-size:12px;margin:6px 0}
.shake{animation:sh .45s}@keyframes sh{0%,100%{transform:none;filter:none}20%{transform:translateX(-5px);filter:drop-shadow(4px 0 0 var(--teal)) drop-shadow(-4px 0 0 var(--rust))}50%{transform:translateX(5px)}80%{transform:translateX(-2px);filter:hue-rotate(40deg)}}
.dmg{position:absolute;left:50%;top:30%;color:var(--rust);font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.06em;pointer-events:none;animation:up 1s forwards;text-shadow:0 0 10px var(--rust)}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
input,select{background:rgba(0,0,0,.5);color:var(--txt);border:0;border-bottom:1px solid rgba(63,214,208,.6);border-radius:0;padding:9px 6px;font:inherit;font-size:13px;width:100%;outline:none}
input:focus,select:focus{border-bottom-color:var(--teal);box-shadow:0 6px 10px -6px var(--teal)}
button{background:transparent;color:var(--teal);border:1px solid var(--teal);border-radius:2px;padding:9px 14px;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.18em;cursor:pointer;text-shadow:0 0 6px var(--teal);box-shadow:0 0 8px rgba(63,214,208,.4),inset 0 0 8px rgba(63,214,208,.15);transition:.15s}
button:hover,button:active{background:rgba(63,214,208,.15);box-shadow:0 0 16px var(--teal)}
button.g{color:var(--gold);border-color:var(--gold);text-shadow:0 0 6px var(--gold);box-shadow:0 0 8px rgba(212,176,119,.4)}
button.s{color:var(--mut);border-color:rgba(138,128,114,.6);text-shadow:none;box-shadow:none}
.mini{display:flex;gap:6px;margin-top:6px}.mini input{flex:1}.mini button{padding:5px 10px;font-size:15px}
ol{margin:6px 0;padding-left:22px;font-size:12px;line-height:1.7}ol li::marker{color:var(--gold)}ol li.done{text-decoration:line-through;color:var(--mut)}
.ms{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.ms span{font-size:10px;letter-spacing:.06em;padding:5px 9px;border:1px solid rgba(138,128,114,.5);color:var(--mut)}.ms span.got{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(212,176,119,.5)}
.coins{display:flex;gap:3px;flex-wrap:wrap;min-height:18px;margin:8px 0;font-size:11px;color:var(--mut)}
.coins i{width:6px;height:16px;background:var(--gold);box-shadow:0 0 6px var(--gold)}
.log{max-height:220px;overflow:auto;font-size:11px}.log div{padding:6px 0;border-bottom:1px solid rgba(63,214,208,.12)}
#over{position:fixed;inset:0;background:rgba(8,7,5,.88);display:none;align-items:center;justify-content:center;z-index:9;flex-direction:column;text-align:center}
#over h2{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:64px;letter-spacing:.2em;color:var(--txt);margin:0;position:relative;text-shadow:0 0 12px var(--teal);animation:glitch 1.2s steps(2) 3}
#over h2::before,#over h2::after{content:attr(data-t);position:absolute;inset:0}
#over h2::before{color:var(--rust);animation:sl1 .9s steps(3) infinite;clip-path:inset(0 0 60% 0)}
#over h2::after{color:var(--teal);animation:sl2 .7s steps(3) infinite;clip-path:inset(55% 0 0 0)}
@keyframes sl1{50%{transform:translate(-6px,-2px)}}@keyframes sl2{50%{transform:translate(6px,2px)}}
@keyframes glitch{0%{opacity:0;transform:scaleY(.05)}20%{opacity:1;transform:scaleY(1.3)}40%{transform:skewX(20deg)}60%{transform:skewX(-10deg)}100%{transform:none}}
#over p{color:var(--gold);letter-spacing:.1em}
.derez{animation:derez 1.2s forwards}@keyframes derez{0%{filter:none}30%{filter:drop-shadow(6px 0 var(--teal)) drop-shadow(-6px 0 var(--rust));transform:skewX(8deg)}60%{clip-path:inset(0 0 40% 0);transform:translateX(-8px)}100%{clip-path:inset(0);opacity:.35}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:10}
label{font-size:10px;letter-spacing:.06em;color:var(--mut)}
#synced{color:var(--teal);font-size:10px}

body,.card,.boss,button,input,select,.stat b,h1{transition:background-color .8s,color .8s,border-color .8s,box-shadow .8s,text-shadow .8s}
body::before,body::after{transition:opacity .8s}
#themeBtn{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));z-index:8;padding:5px 10px;font-size:13px}
body.light{--bg:#f2ede6;--ink:#e8e0d0;--gold:#8a6a2c;--gold2:#6e5320;--teal:#0f7a76;--rust:#b04a18;--txt:#0e0c09;--mut:#6b6358;--card:rgba(255,252,246,.82)}
body.light::before{background:radial-gradient(ellipse at 15% 0%,rgba(224,112,58,.18),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(15,122,118,.16),transparent 55%),#f2ede6}
body.light::after{background-image:linear-gradient(rgba(15,122,118,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(15,122,118,.18) 1px,transparent 1px)}
body.light h1{text-shadow:0 0 1px var(--teal),0 2px 10px rgba(15,122,118,.25)}
body.light .brand,body.light .stat b,body.light button,body.light .dmg{text-shadow:none}
body.light .card{border-color:rgba(15,122,118,.45);box-shadow:0 2px 10px rgba(14,12,9,.08)}
body.light .card::before{box-shadow:0 0 4px var(--gold)}
body.light .boss{border-color:rgba(176,74,24,.45);box-shadow:0 2px 8px rgba(14,12,9,.07)}
body.light .boss.target{border:2px solid #e8641a;box-shadow:0 0 14px rgba(232,100,26,.6),0 0 28px rgba(232,100,26,.25)}body.light .tgt{background:#e8641a;box-shadow:0 0 6px #e8641a;color:#fff}body.light .boss.target .em{color:#e8641a}
body.light .bar{background:rgba(14,12,9,.06);border-bottom-color:rgba(15,122,118,.25)}
body.light .bar i{box-shadow:0 0 4px var(--rust)}body.light .bar.xp i{box-shadow:0 0 4px var(--teal)}body.light .bar.cash i{box-shadow:0 0 4px var(--gold)}
body.light .bar i::after{background:var(--txt);box-shadow:none}
body.light input,body.light select{background:rgba(255,255,255,.6);border-bottom-color:rgba(15,122,118,.5)}
body.light button{box-shadow:none;background:rgba(15,122,118,.05)}body.light button:hover,body.light button:active{background:rgba(15,122,118,.14);box-shadow:none}
body.light button.g{box-shadow:none}body.light .coins i{box-shadow:none}
body.light .ms span.got{box-shadow:0 0 0 1px var(--gold)}body.light .log div{border-bottom-color:rgba(15,122,118,.15)}
body.light #pm{background:rgba(242,237,230,.9)!important}body.light #over{background:rgba(242,237,230,.92)}body.light #over h2{text-shadow:0 0 6px rgba(15,122,118,.5)}
.bh{display:flex;align-items:center;gap:10px;margin:2px 0 6px}.bh h3{margin:0}.mon{font-size:34px;line-height:1;filter:drop-shadow(0 0 6px var(--teal)) drop-shadow(0 0 2px var(--teal))}
.boss.dead .mon{filter:grayscale(1) drop-shadow(0 0 6px var(--rust));opacity:.8}.boss.dead h3{opacity:.5;text-decoration:line-through}
.rhp{margin-top:8px;text-align:center;font-size:10px;letter-spacing:.12em;color:var(--mut)}.rhp b{color:var(--teal);font-weight:500;font-size:12px}.rhp span{white-space:nowrap}
body.light .mon{filter:drop-shadow(0 0 3px var(--teal))}

.vault{margin:12px 0}.vault .vh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.vault .tier{color:var(--gold);font-size:11px;letter-spacing:.14em}
.scene{display:block;width:100%;max-width:480px;margin:10px auto;image-rendering:pixelated;shape-rendering:crispEdges;border:2px solid var(--teal);box-shadow:0 0 8px var(--teal),inset 0 0 8px rgba(63,214,208,.35);border-radius:4px}
.vs{display:flex;justify-content:space-around;text-align:center;margin:4px 0 8px}.vs b{color:var(--teal);font-size:16px}.vs span{display:block;font-size:9px;letter-spacing:.14em;color:var(--mut)}
.vnext{font-size:10px;color:var(--mut);margin-top:4px;letter-spacing:.06em}
.bar.vb{height:6px;margin-top:4px}.bar.vb i{background:var(--gold);box-shadow:0 0 6px var(--gold)}.bar.vb.lk i{background:var(--teal);box-shadow:0 0 6px var(--teal)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}.hero{animation:bob 1.2s steps(1) infinite}
@keyframes spk{0%,70%,100%{opacity:0}80%{opacity:1}}.spk{animation:spk 1.8s steps(1) infinite}.spk.d2{animation-delay:.6s}.spk.d3{animation-delay:1.2s}
@keyframes aura{0%,100%{opacity:.25}50%{opacity:.55}}.aura{animation:aura 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.hero,.spk,.aura{animation:none}}

.hero-card{margin:10px 0 8px;border:2px solid var(--teal);border-radius:14px;overflow:hidden;box-shadow:0 0 10px var(--teal),inset 0 0 10px rgba(63,214,208,.3);line-height:0}
.hero-card img{width:100%;height:auto;display:block}
.hero-card.flash{animation:tierflash 2.2s ease-out}@keyframes tierflash{0%{box-shadow:0 0 0 var(--gold);filter:brightness(2.2)}25%{box-shadow:0 0 40px var(--gold),0 0 80px var(--gold);filter:brightness(1.4)}100%{box-shadow:0 0 10px var(--teal);filter:none}}
.vcap{font-size:11px;letter-spacing:.14em;color:var(--gold);text-align:center;margin-bottom:4px}
.thumbs{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:10px}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;border:1px solid rgba(63,214,208,.35)}
.thumbs img.locked{filter:blur(2px) brightness(.25) grayscale(1)}.thumbs img.cur{border-color:var(--gold);box-shadow:0 0 6px var(--gold)}
.vrh{margin-top:10px;text-align:center;font-size:10px;letter-spacing:.12em;color:var(--mut)}.vrh b{color:var(--teal);font-weight:500;font-size:12px}
body.light .hero-card{box-shadow:0 0 6px var(--teal)}

.grem{font-size:10px;color:var(--rust);letter-spacing:.04em;margin:2px 0}.grem.z{color:var(--mut)}.grem i,.vnext i{opacity:.6;font-size:9px}
.whatif{margin-top:8px}.whatif label{font-size:10px;letter-spacing:.12em;color:var(--mut)}.whatif input{width:100%;accent-color:var(--teal)}
.raid{border-color:var(--gold)!important;box-shadow:0 0 10px var(--gold)}.raidrow{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:12px}.raidrow b{color:var(--rust)}.raidrow .ok{opacity:.6;text-decoration:line-through}
.shelf{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}.tro{text-align:center;font-size:20px;filter:grayscale(1) brightness(.5);opacity:.6}.tro.on{filter:drop-shadow(0 0 4px var(--gold));opacity:1}.tro i{display:block;font-size:7px;font-style:normal;letter-spacing:.04em;color:var(--mut);line-height:1.1;margin-top:2px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);z-index:30;background:var(--bg,#080705);border:1px solid var(--gold);box-shadow:0 0 12px var(--gold);color:var(--gold);padding:10px 16px;font-size:12px;letter-spacing:.1em;border-radius:6px;opacity:0;pointer-events:none}
#toast.show{animation:toast 3s ease}@keyframes toast{0%{opacity:0;transform:translateX(-50%) translateY(120px)}12%,80%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(120px)}}
.pet{display:flex;align-items:center;gap:8px;margin:-2px 0 6px}.pe{font-size:30px;display:inline-block}.pe.alien{filter:hue-rotate(80deg) saturate(1.6)}
.pet.happy .pe{animation:hop .7s ease-in-out infinite}.pet.meh .pe{animation:sway 3s ease-in-out infinite}.pet.sad .pe{transform:rotate(12deg) translateY(4px);filter:grayscale(.6)}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.bub{position:relative;font-size:10px;padding:5px 8px;border:1px solid var(--teal);border-radius:8px;color:var(--fg,inherit);background:rgba(63,214,208,.08)}.bub b{color:var(--teal);font-weight:500}.bub:before{content:'';position:absolute;left:-6px;top:50%;margin-top:-4px;border:4px solid transparent;border-right-color:var(--teal);border-left:0;width:0}
#cut{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(5,6,18,.92)}.cbox{width:min(420px,92vw);text-align:center}
#cut h2{font-family:'Bebas Neue',sans-serif;font-size:46px;color:var(--teal);text-shadow:0 0 12px var(--teal);margin:4px 0;letter-spacing:.06em}#cName{color:#f2ede6;letter-spacing:.14em;margin:0 0 10px}
#cArt{width:100%;border-radius:12px;border:2px solid var(--teal);box-shadow:0 0 14px var(--teal);margin-bottom:12px}
.cboom{font-size:90px;height:110px;line-height:110px}.cboom.go{animation:boom 1.6s ease-out forwards}
@keyframes boom{0%{transform:scale(1);filter:none}30%{transform:scale(1.4) rotate(-8deg);filter:brightness(2) drop-shadow(0 0 20px #f1c232)}55%{transform:scale(2.2);opacity:.9;filter:brightness(3) blur(2px)}100%{transform:scale(3);opacity:0;filter:blur(8px)}}
#cut h2,#cName,#cArt{animation:cin .8s .9s both}@keyframes cin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style></head><body>
<canvas id="cf"></canvas>
<button id="themeBtn" class="s" onclick="cycleTheme()">AUTO</button>
<div id="pm" style="position:fixed;inset:0;z-index:11;display:none;align-items:center;justify-content:center;background:rgba(8,7,5,.85)">
<div class="card" style="width:min(340px,90vw);text-align:center"><b>UNLOCK</b>
<p style="font-size:11px;color:var(--mut)">Balances are encrypted. Enter your passcode once; this device remembers the key, not the passcode.</p>
<input id="pmIn" type="password" autocomplete="current-password" placeholder="Passcode"><div id="pmErr" style="color:var(--rust);font-size:11px;min-height:16px;margin:6px 0"></div>
<div class="row"><button class="s" id="pmNo">LATER</button><button id="pmOk">UNLOCK</button></div></div></div>
<div id="over"><h2 data-t="DEREZZED">DEREZZED</h2><p id="overtxt" style="font-size:18px"></p><button onclick="over.style.display='none'">CONTINUE</button></div>
<div id="cut" onclick="if(event.target===this)closeCut()"><div class="cbox"><div class="cboom" id="cEm"></div><h2 data-t="BOSS DEFEATED">BOSS DEFEATED</h2><p id="cName"></p><img id="cArt" alt=""><div class="row" style="justify-content:center"><button onclick="shareWin()">SHARE / SAVE</button><button class="s" onclick="closeCut()">CONTINUE</button></div></div></div>
<div id="toast"></div>
<div class="wrap">
<span class="brand">AP'S CLUBHOUSE</span><h1>DEBT QUEST</h1><div class="sub" id="synced"></div>

<div class="card raid" id="raid" style="display:none"></div>
<div class="card"><div class="row">
<div class="stat"><b id="tot">—</b><span>DEBT LEFT</span></div>
<div class="stat"><b id="paid">$0</b><span>PAID OFF</span></div>
<div class="stat"><b id="eta">—</b><span>DEBT-FREE ETA</span></div></div>
<div class="bar" style="margin-top:10px"><i id="totbar"></i></div>
<div id="extras" style="display:none"><div class="vnext" id="gremTot" style="text-align:center;margin-top:8px"></div>
<div class="whatif"><label>WHAT IF +<b id="wiv">$0</b>/MO EXTRA</label><input type="range" id="wi" min="0" max="1500" step="50" value="0" oninput="whatIf()"><div class="vnext" id="wio"></div></div></div></div>

<div class="card vault" id="vault" style="display:none"></div>
<div class="card" id="trophies" style="display:none"></div>
<div class="bosses" id="bosses"></div>

<div class="row" style="justify-content:center;margin-top:12px">
<button class="s" onclick="syncState='';autoSync()">SYNC</button>
<button class="s" onclick="lockNow()">LOCK</button></div>
</div>
<script>

// Privacy: balances live in memory only; the only thing persisted is the last-seen tier number.

localStorage.removeItem(K);try{indexedDB.deleteDatabase('dqKeys')}catch(e){}  // migration: wipe old stored balances + key

const TAG={ven:'VNT',qs:'QSV',rh:'RHC',boa:'BOA',kl:'KLA',af:'AFF',ap:'AFP'};
const totS=()=>S.debts.reduce((a,d)=>a+d.s,0),totB=()=>S.debts.reduce((a,d)=>a+d.b,0);
function render(){
 const ts=totS(),tb=totB(),paid=Math.max(0,ts-tb);
 $('paid').textContent=S.unlocked?f(paid):'—';$('tot').textContent=S.unlocked?f(tb):'—';$('totbar').style.width=(ts?tb/ts*100:0)+'%';
 const days=Math.max(1,(Date.now()-new Date(S.startDate||Date.now()))/864e5),rate=paid>0&&days>20?paid/days*30.4:(S.etaRate||0);
 const d=new Date();d.setDate(d.getDate()+tb/rate*30.4);
 $('eta').textContent=!S.unlocked?'LOCKED':tb<=0?'FREE!':!rate?'—':d.toLocaleDateString('en-US',{month:'short',year:'numeric'});

 renderVault();renderExtras();
 const live=S.debts.filter(x=>x.b>0&&!x.bnpl).sort((a,b)=>a.o-b.o)[0];
 $('bosses').innerHTML=!S.unlocked?'<div class="card" style="grid-column:1/-1;text-align:center;padding:30px"><b>LOCKED</b><p style="color:var(--mut);font-size:12px">Enter your passcode to load your bosses.</p><button onclick="syncState=\'\';autoSync()">UNLOCK</button></div>':S.debts.slice().sort((a,b)=>a.o-b.o).map(x=>`<div class="boss ${x.b<=0?'dead':''} ${live&&live.id==x.id?'target':''}" id="b_${x.id}">
 <span class="em">${x.b<=0?'OFFLINE':TAG[x.id]}</span><div class="bh"><span class="mon">${x.b<=0?'💥':MON[x.id]}</span><h3>${x.n}</h3>${live&&live.id==x.id?'<span class="tgt">🎯 TARGET</span>':''}</div><div class="meta">${x.apr?'APR '+x.apr:''}${x.bnpl?(x.apr?' · ':'')+'on schedule':''}&nbsp;</div>
 ${gremlin(x)}<div class="hp">HP ${f(x.b)} / ${f(x.s)}</div><div class="bar"><i style="width:${x.s?Math.max(0,x.b/x.s*100):0}%"></i></div></div>`).join('');
}
const cv=$('cf'),cx=cv.getContext('2d');let P=[];
function confetti(n){cv.width=innerWidth;cv.height=innerHeight;const C=document.body.classList.contains('light')?['#0f7a76','#8a6a2c','#b04a18','#0e0c09']:['#3fd6d0','#d4b077','#e0703a','#f2ede6'];for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*11+3;P.push({x:innerWidth/2,y:innerHeight/3,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:C[i%4],l:50+Math.random()*30})}if(P.length==n)tick()}
function tick(){cx.globalCompositeOperation='source-over';cx.fillStyle='rgba(0,0,0,0)';cx.clearRect(0,0,cv.width,cv.height);cx.lineCap='round';P.forEach(p=>{const ox=p.x,oy=p.y;p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy=p.vy*.95+.12;p.l--;cx.strokeStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=12;cx.globalAlpha=Math.min(1,p.l/30);cx.lineWidth=2;cx.beginPath();cx.moveTo(ox-p.vx*2,oy-p.vy*2);cx.lineTo(p.x,p.y);cx.stroke()});cx.globalAlpha=1;P=P.filter(p=>p.l>0);if(P.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height)}

// ---- The Vault: A.P.'s look = % of total debt paid (cartoon tier art) ----

 if(fakePct==null){if(S.lastLook!=null&&L>S.lastLook){const h=$('heroCard');h.classList.add('flash');setTimeout(()=>h.classList.remove('flash'),2200);
   $('overtxt').textContent='TIER '+(L+1)+' · '+lk[1];(o=>{o.textContent='TIER UP';o.dataset.t='TIER UP'})(over.querySelector('h2'));over.style.display='flex';confetti(220);
   setTimeout(()=>{over.style.display='none';(o=>{o.textContent='DEREZZED';o.dataset.t='DEREZZED'})(over.querySelector('h2'))},2600)}
  if(S.lastLook!==L){S.lastLook=L;save()}}}

// ================= FUN LAYER (no balances persisted; only ids/flags in localStorage) =================
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??d}catch(e){return d}},lsSet=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

// 3) interest gremlins
function gremlin(x){if(x.bnpl||x.b<=0)return'';
 if(x.aprn>0)return`<div class="grem">👺 gremlin steals <b>${f(x.b*x.aprn/36500)}</b>/day <i>est.</i></div>`;
 if(x.aprn===0&&x.promo)return`<div class="grem z">💤 gremlin sleeping until ${dOf(x.promo+'-01').toLocaleDateString('en-US',{month:'short',year:'numeric'})} <i>est.</i></div>`;return''}

// 5) what-if (avalanche sim)
function sim(extra){const D=S.debts.filter(x=>x.b>0).map(x=>({b:x.b,a:x.bnpl?0:(x.aprn||0),bn:x.bnpl,o:x.o,promo:x.promo})).sort((p,q)=>(p.bn-q.bn)||(q.a-p.a)||(p.o-q.o));
 const ts=totS(),base=S.etaRate||0,pay=base+extra,tierAt={};if(!pay)return null;const now=new Date();
 for(let m=1;m<=240;m++){const dt=new Date(now.getFullYear(),now.getMonth()+m,1);
  D.forEach(x=>{let a=x.a;if(!a&&x.promo&&dt>dOf(x.promo+'-01'))a=28;x.b+=x.b*a/1200});let r=pay;
  for(const x of D){const p=Math.min(r,x.b);x.b-=p;r-=p;if(r<=0)break}
  const left=D.reduce((a,x)=>a+x.b,0),pc=ts?(ts-left)/ts*100:100;LOOKS.forEach((l,i)=>{if(pc>=l[0]&&tierAt[i]==null)tierAt[i]=dt});
  if(left<=0.5)return{m,dt,tierAt}}return{m:999,dt:null,tierAt}}
const mY=d=>d?d.toLocaleDateString('en-US',{month:'short',year:'numeric'}):'—';
function whatIf(){const e=+$('wi').value;$('wiv').textContent='$'+e.toLocaleString();const a=sim(0),b=sim(e);if(!b){$('wio').textContent='';return}
 const L=lookIdx(curPct()),nx=LOOKS[L+1];
 $('wio').innerHTML=`→ debt-free <b>${mY(b.dt)}</b>${a&&e?` (${Math.max(0,a.m-b.m)} mo sooner)`:''}${nx?` · ${nx[1]} by <b>${mY(b.tierAt[L+1])}</b>`:''} <i>est.</i>`}
// 2) raid
function raidState(){const R=S.raid;if(!R||!R.items)return null;const M=Object.fromEntries(Object.entries(MAP));
 const it=R.items.map(i=>{const x=S.debts.find(d=>d.id==M[i.boss]);const done=x&&i.baseline!=null&&(i.baseline-x.b)>=i.amount*.95;return{...i,x,done}});return{R,it,done:it.every(i=>i.done)}}
function renderRaid(){const el=$('raid'),rs=raidState();if(!S.unlocked||!rs){el.style.display='none';return}
 const d0=dOf(rs.R.date),t=today0(),diff=(t-d0)/864e5,dom=t.getDate();
 const show=S.forceRaid||((diff>=0&&diff<=1)&&[2,3,16,17].includes(dom));if(!show){el.style.display='none';return}
 el.style.display='';el.innerHTML=`<div class="vh"><b>⚔ PAYDAY RAID · ${d0.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase()}</b><span class="tier">${rs.done?'RAID CLEARED ✓':'PLANNED HITS'}</span></div>
 <div class="raidrow">${rs.it.map(i=>`<span class="${i.done?'ok':''}">${i.x?MON[i.x.id]:''} ${i.x?i.x.n:i.boss} <b>−${f(i.amount)}</b>${i.done?' ✓':''}</span>`).join('')}</div>`}
// 4) achievements
const ACH=[['first','🩸','First Blood',()=>S.debts.some(x=>x.s>0&&x.b<=0)],['u10','🔟','Under $10k',()=>totB()<10000],['u5','5️⃣','Under $5k',()=>totB()<5000],
 ['half','🌓','Halfway',()=>curPct()>=50],['nobnpl','🧊','No New BNPL 30d',()=>S.lastBnpl&&(today0()-dOf(S.lastBnpl))/864e5>=30],['raid','⚔️','Payday Warrior',()=>{const r=raidState();return r&&r.done}],
 ['grem','🗡️','Gremlin Slayer',()=>S.debts.filter(x=>!x.bnpl&&x.s>0).every(x=>x.b<=0)],['free','🏆','Debt-Free',()=>totB()<=0&&totS()>0]];
function renderTrophies(check){const el=$('trophies');if(!S.unlocked){el.style.display='none';return}
 let got=ls('dqTrophies',[]);const fresh=[];if(check)ACH.forEach(([id,,n,c])=>{if(!got.includes(id)&&c()){got.push(id);fresh.push(n)}});if(fresh.length){lsSet('dqTrophies',got);fresh.forEach((n,i)=>setTimeout(()=>toast('🏆 ACHIEVEMENT: '+n),i*1800))}
 el.style.display='';el.innerHTML=`<div class="vh"><b>TROPHIES</b><span class="tier">${got.length}/${ACH.length}</span></div><div class="shelf">${ACH.map(([id,e,n])=>`<span class="tro ${got.includes(id)?'on':''}" title="${n}">${e}<i>${n}</i></span>`).join('')}</div>`}
function toast(t){const el=$('toast');el.textContent=t;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
// 6) pet
const PETS=['🐀','🐀','🐶','🐶','🦙','🤖','🐲','🐲'],PETN=['RAT','RAT','ALIEN PUP','ALIEN PUP','JET LLAMA','BUTLER BOT','BABY DRAGON','BABY DRAGON'];
function petMood(){const prev=S.debts.reduce((a,x)=>a+(x.prev!=null?x.prev:x.b),0),d=+(totB()-prev).toFixed(2);
 const nb=S.lastBnpl&&S.lastSyncAsOf&&(dOf(S.lastSyncAsOf)-dOf(S.lastBnpl))/864e5<=7;
 if(nb)return['sad','A new BNPL appeared… 😿'];if(d<0)return['happy',`We hit them for ${f(-d)}! ✨`];if(d>0)return['sad',`Debt crept up ${f(d)}… 😟`];return['meh','Holding the line. Next payday we strike.']}
function petHTML(L){const[m,t]=S.fakeMood||petMood();return`<div class="pet ${m}"><span class="pe${L==2||L==3?' alien':''}">${PETS[L]}</span><span class="bub"><b>${PETN[L]}</b> · ${t}</span></div>`}
// 1) defeat cutscene
let cutQ=[];function checkDefeats(){const dz=ls('dqDefeated',[]);S.debts.forEach(x=>{if(x.s>0&&x.b<=0&&!dz.includes(x.id)){dz.push(x.id);cutQ.push(x)}});lsSet('dqDefeated',dz);if(cutQ.length&&$('cut').style.display!=='flex')nextCut()}
function nextCut(){const x=cutQ.shift();if(!x)return;S.cutX=x;$('cEm').textContent=MON[x.id];$('cEm').className='cboom';void $('cEm').offsetWidth;$('cEm').className='cboom go';
 $('cName').textContent=x.n.toUpperCase();$('cArt').src='art/tier'+(lookIdx(curPct())+1)+'.webp';$('cut').style.display='flex';confetti(300);setTimeout(()=>confetti(200),1200)}
function closeCut(){$('cut').style.display='none';nextCut()}
async function shareWin(){const x=S.cutX;if(!x)return;const c=document.createElement('canvas');c.width=1080;c.height=1350;const g=c.getContext('2d');
 g.fillStyle='#0b1028';g.fillRect(0,0,1080,1350);const im=new Image();im.src=$('cArt').src;await im.decode().catch(()=>{});try{g.drawImage(im,0,0,1080,608)}catch(e){}
 g.strokeStyle='#3fd6d0';g.lineWidth=8;g.shadowColor='#3fd6d0';g.shadowBlur=24;g.strokeRect(20,20,1040,1310);g.shadowBlur=30;
 g.textAlign='center';g.fillStyle='#f1c232';g.font='160px serif';g.fillText('💥',540,820);g.fillStyle='#3fd6d0';g.font='120px "Bebas Neue",sans-serif';g.fillText('BOSS DEFEATED',540,990);
 g.fillStyle='#f2ede6';g.font='72px "Bebas Neue",sans-serif';g.fillText(x.n.toUpperCase(),540,1090);g.shadowBlur=0;g.fillStyle='#9aa';g.font='40px "Bebas Neue",sans-serif';g.fillText("DEBT QUEST · AP'S CLUBHOUSE",540,1260);
 const blob=await new Promise(r=>c.toBlob(r,'image/png')),file=new File([blob],'boss-defeated.png',{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Boss defeated: '+x.n})}catch(e){}}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='boss-defeated-'+x.id+'.png';a.click()}}
function renderExtras(){const on=S.unlocked;$('extras').style.display=on?'':'none';if(!on){$('raid').style.display='none';$('trophies').style.display='none';return}
 const di=dailyInterest();$('gremTot').innerHTML=di>0?`👺 interest gremlins steal <b>${f(di)}</b>/day <i>est.</i>`:'';whatIf();renderRaid();renderTrophies(false)}
function afterSync(){let hit=0;S.debts.forEach(x=>{if(x.prev!=null&&x.prev>x.b){hit++;setTimeout(()=>hitFx(x.id,+(x.prev-x.b).toFixed(2)),300)}});if(hit)confetti(60);renderTrophies(true);checkDefeats()}
render();

// ---- Theme: Auto (light 7AM-7PM local) / Light / Dark ----
const TK='dqTheme';
function applyTheme(){const m=localStorage.getItem(TK)||'auto',hr=new Date().getHours(),light=m==='light'||(m==='auto'&&hr>=7&&hr<19);
 document.body.classList.toggle('light',light);document.querySelector('meta[name=theme-color]').setAttribute('content',light?'#f2ede6':'#080705');
 if(typeof renderVault==='function')renderVault();$('themeBtn').textContent=(m==='auto'?'AUTO':m==='light'?'LIGHT':'DARK')+(m==='auto'?(light?' ☀':' ☾'):'');}
function cycleTheme(){const o=['auto','light','dark'],m=localStorage.getItem(TK)||'auto';localStorage.setItem(TK,o[(o.indexOf(m)+1)%3]);applyTheme()}
applyTheme();setInterval(applyTheme,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)applyTheme()});

// ---- Auto-sync ----
const MAP={klarna:'kl',affirm:'af',afterpay:'ap',robinhood_card:'rh',venture:'ven',quicksilver:'qs',bofa:'boa'};
localStorage.removeItem('dqSyncToken');if(location.search.includes('sync='))history.replaceState(null,'',location.pathname);
// key store: non-extractable AES-GCM CryptoKey in IndexedDB, tagged with the salt it was derived for
let memKey=null;  // non-extractable CryptoKey held in memory only; gone when the app closes
const kGet=async()=>memKey,kPut=async v=>{memKey=v||null};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64(salt),iterations:600000},base,{name:'AES-GCM',length:256},false,['decrypt'])}
const dec=(key,e)=>crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct)).then(p=>JSON.parse(new TextDecoder().decode(p)));
function askPass(err){return new Promise(res=>{$('pmErr').textContent=err||'';$('pmIn').value='';$('pm').style.display='flex';setTimeout(()=>$('pmIn').focus(),50);
 $('pmOk').onclick=()=>{const v=$('pmIn').value;if(!v)return;$('pm').style.display='none';res(v)};$('pmIn').onkeydown=e=>{if(e.key==='Enter')$('pmOk').onclick()};
 $('pmNo').onclick=()=>{$('pm').style.display='none';res(null)}})}
function lockNow(){memKey=null;const ll=S.lastLook;S=init();S.lastLook=ll;syncState='Locked';render();showSynced()}
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>5*60*1000&&S.unlocked)lockNow()});
let syncState='';
function hitFx(id,a){const el=$('b_'+id);if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');const dm=document.createElement('div');dm.className='dmg';dm.textContent='-$'+Math.round(a).toLocaleString();el.appendChild(dm)}
function showSynced(){$('synced').textContent=syncState||(S.lastSyncAsOf?'Last synced '+new Date(S.lastSyncAsOf.length<=10?S.lastSyncAsOf+'T12:00':S.lastSyncAsOf).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'')}
async function fetchBalances(){const r=await fetch('data/balances.enc.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)return null;const e=await r.json();
 let k=await kGet();if(k&&k.salt===e.salt){try{return await dec(k.key,e)}catch(x){await kPut(null)}}
 let err='';for(let i=0;i<5;i++){const p=await askPass(err);if(!p){syncState='Locked';showSynced();return null}
  syncState='DECRYPTING…';showSynced();const key=await deriveKey(p,e.salt);
  try{const j=await dec(key,e);await kPut({key,salt:e.salt});syncState='';return j}catch(x){err='That passcode didn\'t unlock it. Try again.';syncState=''}}
 return null}
let syncing=false;async function autoSync(){if(syncing||!navigator.onLine)return;syncing=true;
 try{const j=await fetchBalances();if(!j)return;
  if(!j.as_of||(S.unlocked&&S.lastSyncAsOf&&j.as_of<=S.lastSyncAsOf)){showSynced();return}
  const first=!S.lastSyncAsOf||!S.unlocked,hits=[],kills=[];
  const st=j.start||{},mt=j.meta||{};if(j.start_date)S.startDate=j.start_date;if(j.eta_rate)S.etaRate=j.eta_rate;
  for(const[k,id]of Object.entries(MAP)){const x=S.debts.find(d=>d.id==id);if(st[k]!=null)x.s=+st[k];if(mt[k]){x.apr=mt[k].apr||''}x.aprn=(j.apr_num||{})[k]??null;x.promo=(j.promo_end||{})[k]||null;x.prev=(j.previous||{})[k]??null}
  S.raid=j.raid_plan||null;S.lastBnpl=j.last_new_bnpl_date||null;S.prevAsOf=(j.previous||{}).as_of||null;
  S.unlocked=true;
  for(const[k,id]of Object.entries(MAP)){if(j[k]==null)continue;const x=S.debts.find(d=>d.id==id),nb=+(+j[k]).toFixed(2),was=x.b;
   if(!first&&nb<was){const dmg=+(was-nb).toFixed(2);hits.push([id,dmg]);if(nb<=0&&was>0)kills.push(x)}
   x.b=nb;if(nb>x.s)x.s=nb}
  S.rhPort=j.robinhood_portfolio??null;S.rhBP=j.robinhood_buying_power??null;S.lastSyncAsOf=j.as_of;save();render();showSynced();
  afterSync();
 }catch(e){console.warn('sync failed',e)}finally{syncing=false}}
showSynced();autoSync();addEventListener('online',autoSync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoSync()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));
</script></body></html>
